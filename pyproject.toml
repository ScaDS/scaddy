[project]
name = "scaddy"
version = "1.0.0"
description = "Multi-agent conversational AI for Living Lab tours"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Oliver Welz", email = "oliver.welz@uni-leipzig.de" },
    { name = "Philipp Schott" },
    { name = "Gregor Wolf" },
]
keywords = [
    "conversational-ai",
    "living-lab",
    "multi-agent",
    "speech-to-text",
    "text-to-speech",
    "clip",
    "faster-whisper",
    "fastapi",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    # uvicorn[standard] pulls in websockets + httptools (needed for /ws)
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.18",
    # AI/ML — torch pinned to the tested CUDA 12.6 build
    "torch==2.7.1",
    "torchaudio==2.7.1",
    # transformers 5.x broke CLIPModel.get_image_features()
    # (returns ModelOutput instead of Tensor) → pin to 4.x
    "transformers>=4.54.0,<5.0.0",
    "faster-whisper>=1.1.0",
    "silero-vad>=5.1.0",
    # onnxruntime 1.24+ requires Python 3.11+, container uses 3.10
    "onnxruntime<1.24",
    # OpenAI-compatible API client
    "openai>=1.50.0",
    # Audio processing
    "pydub>=0.25.1",
    # Image processing
    "pillow>=10.0.0",
    # HTTP client
    "requests>=2.32.0",
    # Environment
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/scads/scaddy"
Repository = "https://github.com/scads/scaddy"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["modules"]

[tool.uv]
# PyTorch with CUDA support comes from the official PyTorch index.
# See: https://docs.astral.sh/uv/guides/integration/pytorch/
package = false

[tool.uv.sources]
# Pin torch/torchvision/torchaudio to the CUDA 12.6 wheels
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
